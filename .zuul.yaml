        secret: SECRET_K8S_CAPI_IMAGES
        pass-to-parent: true

- project:
    merge-mode: squash-merge
    default-branch: main
    check:
      jobs:
        - flake8
        - yamllint
        - k8s-capi-images-build-v1.34
        - k8s-capi-images-build-v1.35
        - k8s-capi-images-build-v1.36
        - k8s-capi-images-build-v1.37
    post:
      jobs:
        - k8s-capi-images-publish-v1.34:
            branches: main
        - k8s-capi-images-publish-v1.35:
            branches: main
        - k8s-capi-images-publish-v1.36:
            branches: main
        - k8s-capi-images-publish-v1.37:
            branches: main
