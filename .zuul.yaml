- job:
    name: abstract-k8s-capi-images-build
    abstract: true
    parent: base
    nodeset: ubuntu-noble-large
    pre-run: playbooks/pre.yml
    # NOTE: the upload tasks still live at the tail of playbooks/build.yml,
    # which runs BEFORE playbooks/validate.yml, so a publish run uploads the
    # image before goss validates it. To let validation gate publishing, move
    # the upload tasks into a playbooks/publish.yml appended AFTER
    # playbooks/validate.yml here; a failed validation then fails the job
    # before any upload runs.
    run:
      - playbooks/build.yml
      - playbooks/validate.yml
    timeout: 7200
    vars:
      upload_image: false

- job:
    name: abstract-k8s-capi-images-publish
    abstract: true
    parent: abstract-k8s-capi-images-build
    vars:
      upload_image: true

# Every files matcher below includes .zuul.yaml, so changing the pipeline
# itself (e.g. arming a publish job) triggers the builds and publishes. Each
# publish run always rebuilds and overwrites the unversioned series image
# (ubuntu-XXXX-kube-vX.YY.qcow2); the CHECKSUM pre-check in playbooks/build.yml
# only keeps the versioned image (ubuntu-XXXX-kube-vX.YY.Z.qcow2) and the
# last-X pointer create-once.
- job:
    name: k8s-capi-images-build-v1.34
    parent: abstract-k8s-capi-images-build
    vars:
      kubernetes_version: v1.34
    files: &files_v1_34
      - ^overrides/v1\.34\.json$
      - ^elements/k8s-capi/.*
      - ^playbooks/.*
      - ^scripts/render-goss-vars\.py$
      - ^requirements\.txt$
      - ^\.zuul\.yaml$

- job:
    name: k8s-capi-images-build-v1.35
    parent: abstract-k8s-capi-images-build
    vars:
      kubernetes_version: v1.35
    files: &files_v1_35
      - ^overrides/v1\.35\.json$
      - ^elements/k8s-capi/.*
      - ^playbooks/.*
      - ^scripts/render-goss-vars\.py$
      - ^requirements\.txt$
      - ^\.zuul\.yaml$

- job:
    name: k8s-capi-images-build-v1.36
    parent: abstract-k8s-capi-images-build
    vars:
      kubernetes_version: v1.36
    files: &files_v1_36
      - ^overrides/v1\.36\.json$
      - ^elements/k8s-capi/.*
      - ^playbooks/.*
      - ^scripts/render-goss-vars\.py$
      - ^requirements\.txt$
      - ^\.zuul\.yaml$

- job:
    name: k8s-capi-images-build-v1.37
    parent: abstract-k8s-capi-images-build
    vars:
      kubernetes_version: v1.37
    files: &files_v1_37
      - ^overrides/v1\.37\.json$
      - ^elements/k8s-capi/.*
      - ^playbooks/.*
      - ^scripts/render-goss-vars\.py$
      - ^requirements\.txt$
      - ^\.zuul\.yaml$

- job:
    name: k8s-capi-images-publish-v1.34
    parent: abstract-k8s-capi-images-publish
    vars:
      kubernetes_version: v1.34
    files: *files_v1_34
    secrets:
      - name: secret
        secret: SECRET_K8S_CAPI_IMAGES
        pass-to-parent: true

- job:
    name: k8s-capi-images-publish-v1.35
    parent: abstract-k8s-capi-images-publish
    vars:
      kubernetes_version: v1.35
    files: *files_v1_35
    secrets:
      - name: secret
        secret: SECRET_K8S_CAPI_IMAGES
        pass-to-parent: true

- job:
    name: k8s-capi-images-publish-v1.36
    parent: abstract-k8s-capi-images-publish
    vars:
      kubernetes_version: v1.36
    files: *files_v1_36
    secrets:
      - name: secret
        secret: SECRET_K8S_CAPI_IMAGES
        pass-to-parent: true

- job:
    name: k8s-capi-images-publish-v1.37
    parent: abstract-k8s-capi-images-publish
    vars:
      kubernetes_version: v1.37
    files: *files_v1_37
    secrets:
