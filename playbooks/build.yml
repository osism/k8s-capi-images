---
- name: Build and publish a CAPI image
  hosts: all

  tasks:
    - name: Resolve the override file for this build
      ansible.builtin.set_fact:
        override_file: "overrides/{{ kubernetes_version | default('v1.33') }}.json"

    - name: Derive the image name components from the override file
      ansible.builtin.set_fact:
        image_dir: "ubuntu-2404-kube-{{ override_data.kubernetes_series }}"
        image_basename: "ubuntu-2404-kube-{{ override_data.kubernetes_semver }}"
        series_basename: "ubuntu-2404-kube-{{ override_data.kubernetes_series }}"
        last_file: "last-{{ override_data.kubernetes_series | regex_replace('^v', '') }}"
      vars:
        override_data: "{{ lookup('file', playbook_dir ~ '/../' ~ override_file) | from_json }}"

    - name: Validate the derived image name components
      ansible.builtin.assert:
        that:
          - image_dir is match('^[A-Za-z0-9._-]+$')
          - image_basename is match('^[A-Za-z0-9._-]+$')
          - series_basename is match('^[A-Za-z0-9._-]+$')
          - last_file is match('^[A-Za-z0-9._-]+$')
        fail_msg: >-
          Refusing to build: image name components derived from the override file
          contain characters outside [A-Za-z0-9._-]
          (image_dir={{ image_dir }}, image_basename={{ image_basename }},
          series_basename={{ series_basename }}, last_file={{ last_file }}).

    # Every publish run produces two images from one build:
    #
    #   * the versioned image (ubuntu-2404-kube-v1.37.0.qcow2) is create-once:
    #     when its CHECKSUM is already in the object storage, it is not
    #     overwritten and the last-X pointer is left untouched;
    #   * the series image (ubuntu-2404-kube-v1.37.qcow2) is always overwritten,
    #     so every merged change that triggers the job ships a fresh "latest"
    #     image of the series, even when the Kubernetes version did not change.
    #
    # Check builds (upload_image: false) always build, since they validate the
    # change under test.
    - name: Check whether the versioned image has already been published
      ansible.builtin.uri:
        url: "https://nbg1.your-objectstorage.com/osism/openstack-k8s-capi-images/{{ image_dir }}/{{ image_basename }}.qcow2.CHECKSUM"
        method: HEAD
        # A missing object answers 403 instead of 404 because the bucket does
        # not grant list permission; both mean "not published yet".
        status_code: [200, 403, 404]
      register: published_checksum
      when: upload_image | default(false) | bool

    - name: Decide whether the versioned image still needs to be uploaded
      ansible.builtin.set_fact:
        image_already_published: "{{ (published_checksum.status | default(0)) == 200 }}"

    - name: Note that the versioned image is already published
      ansible.builtin.debug:
        msg: >-
          {{ image_dir }}/{{ image_basename }}.qcow2 is already published and
          will not be overwritten; only {{ image_dir }}/{{ series_basename }}.qcow2
          is refreshed from this build.
      when: image_already_published

    - name: Build the image with disk-image-create
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -x

          source /tmp/venv/bin/activate
          export ELEMENTS_PATH=./elements
          export DIB_RELEASE=noble

          export DIB_K8S_CAPI_OVERRIDE
          DIB_K8S_CAPI_OVERRIDE="$(readlink -f "${OVERRIDE_FILE}")"

          FILE="${IMAGE_BASENAME}.qcow2"
          SERIES_FILE="${SERIES_BASENAME}.qcow2"

          mkdir -p output
          disk-image-create -a amd64 -t qcow2 \
              -o "output/${IMAGE_BASENAME}" \
              ubuntu vm growroot openssh-server k8s-capi

          cd output
          # The series image is the same build under its unversioned name; a
          # hard link keeps the CHECKSUM line carrying the right file name.
          ln -f "${FILE}" "${SERIES_FILE}"
          sha256sum "${FILE}" > "${FILE}.CHECKSUM"
          sha256sum "${SERIES_FILE}" > "${SERIES_FILE}.CHECKSUM"
          printf '%s %s/%s\n' "$(date +%F)" "${IMAGE_DIR}" "${FILE}" > "${LAST_FILE}"
      environment:
        OVERRIDE_FILE: "{{ override_file }}"
        IMAGE_DIR: "{{ image_dir }}"
        IMAGE_BASENAME: "{{ image_basename }}"
        SERIES_BASENAME: "{{ series_basename }}"
        LAST_FILE: "{{ last_file }}"
      changed_when: true

    - name: Write the rclone configuration with the object-storage credentials
      ansible.builtin.copy:
        dest: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}/.rclone.conf"
        mode: "0600"
        content: |
          [s3]
          type = s3
          provider = Ceph
          endpoint = https://nbg1.your-objectstorage.com
          region = nbg1
          access_key_id = {{ secret.ACCESS_KEY | trim }}
          secret_access_key = {{ secret.SECRET_KEY | trim }}
          acl = public-read
          no_check_bucket = true
      when: upload_image | default(false) | bool
      no_log: true

    - name: Publish the versioned image and the last-X pointer to the object storage
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -x

          FILE="${IMAGE_BASENAME}.qcow2"

          cd output
          rclone copyto "${FILE}" "s3:osism/openstack-k8s-capi-images/${IMAGE_DIR}/${FILE}"
          rclone copyto "${FILE}.CHECKSUM" "s3:osism/openstack-k8s-capi-images/${IMAGE_DIR}/${FILE}.CHECKSUM"
          rclone copyto "${LAST_FILE}" "s3:osism/openstack-k8s-capi-images/${LAST_FILE}"
      environment:
        RCLONE_CONFIG: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}/.rclone.conf"
        IMAGE_DIR: "{{ image_dir }}"
        IMAGE_BASENAME: "{{ image_basename }}"
        LAST_FILE: "{{ last_file }}"
      when:
        - upload_image | default(false) | bool
        - not image_already_published
      changed_when: true

    - name: Publish the series image to the object storage
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -x

          SERIES_FILE="${SERIES_BASENAME}.qcow2"

          cd output
          rclone copyto "${SERIES_FILE}" "s3:osism/openstack-k8s-capi-images/${IMAGE_DIR}/${SERIES_FILE}"
          rclone copyto "${SERIES_FILE}.CHECKSUM" "s3:osism/openstack-k8s-capi-images/${IMAGE_DIR}/${SERIES_FILE}.CHECKSUM"
      environment:
        RCLONE_CONFIG: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}/.rclone.conf"
        IMAGE_DIR: "{{ image_dir }}"
        SERIES_BASENAME: "{{ series_basename }}"
      when: upload_image | default(false) | bool
      changed_when: true
